name: Go CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native SQLite build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev
      - name: Go vet
        env:
          CGO_ENABLED: '1'
        run: go vet ./...
      - name: Build
        env:
          CGO_ENABLED: '1'
        run: go build ./...
      - name: Tests
        env:
          CGO_ENABLED: '1'
        run: go test -count=1 -coverpkg=./internal/...,./config/... -coverprofile=coverage.out ./tests/...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
